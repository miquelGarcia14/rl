<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src ws://127.0.0.1:* ws://localhost:*;">
<title>RL Overlay</title>
<style>
  :root { --scale: 1; --blue: #2f7cff; --orange: #ff8a1f; --ink: #f4f6fb; --glass: rgba(10,12,20,.62); --line: rgba(255,255,255,.14); }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  body.bg { background: #0f1219; }
  #root { transform: scale(var(--scale)); transform-origin: top left; padding: 10px; display: inline-block; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .card { background: var(--glass); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-width: 330px; }
  .team { padding: 10px 16px; font-weight: 800; font-size: 34px; line-height: 1; display: flex; align-items: center; gap: 12px; }
  .team.b { justify-content: flex-start; border-radius: 12px 0 0 12px; }
  .team.o { justify-content: flex-end; border-radius: 0 12px 12px 0; }
  .team .name { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
  .clock { padding: 8px 16px; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 26px; text-align: center; background: rgba(0,0,0,.35); }
  .clock.ot { color: #ffd166; }
  .player { min-width: 300px; padding: 10px 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; }
  .player .pname { font-weight: 700; font-size: 15px; grid-column: 1 / -1; display: flex; justify-content: space-between; }
  .player .pname small { opacity: .7; font-weight: 500; }
  .bar { position: relative; height: 14px; border-radius: 7px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar > i { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg,#ffb347,#ff7a1a); transition: width .12s linear; }
  .bar.boosting > i { background: linear-gradient(90deg,#ffe28a,#ff9a2a); box-shadow: 0 0 10px #ffb347; }
  .val { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; min-width: 64px; text-align: right; }
  .val small { font-size: 11px; font-weight: 600; opacity: .7; margin-left: 3px; }
  .speed.ss { color: #7cf; text-shadow: 0 0 10px rgba(120,200,255,.8); }
  .feed { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; max-width: 520px; }
  .feed .item { padding: 6px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; background: var(--glass); border: 1px solid var(--line); border-left: 4px solid #888; animation: pop .25s ease-out; }
  .feed .item.goal { border-left-color: #ffd166; font-size: 16px; }
  .feed .item .sub { opacity: .75; font-weight: 500; margin-left: 8px; }
  .idle { padding: 10px 14px; font-size: 13px; opacity: .85; }
  .idle b { color: #ffd166; }
  .hidden { display: none !important; }
  @keyframes pop { from { transform: translateY(-4px); opacity: 0 } to { transform: none; opacity: 1 } }
</style>
</head>
<body>
<div id="root">
  <div class="row">
    <div class="card score" id="score">
      <div class="team b" id="tb"><span class="name">Azul</span><span id="sb">0</span></div>
      <div class="clock" id="clock">5:00</div>
      <div class="team o" id="to"><span id="so">0</span><span class="name">Naranja</span></div>
    </div>
    <div class="card player" id="player">
      <div class="pname"><span id="pn">—</span><small id="pstats"></small></div>
      <div class="bar" id="bbar"><i id="bfill"></i></div>
      <div class="val" id="boost">0<small>boost</small></div>
      <div style="font-size:12px;opacity:.7">velocidad</div>
      <div class="val speed" id="speed">0<small>km/h</small></div>
    </div>
  </div>
  <div class="feed" id="feed"></div>
  <div class="card idle" id="idle">Esperando partida… <span id="conn">conectando a la Stats API</span></div>
</div>
<script src="shared/statsclient.js"></script>
<script src="overlay.js"></script>
</body>
</html>
